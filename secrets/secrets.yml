# ============================================================
# Kubernetes Secret — equivalent to secrets/secrets.yml
# Replace #{...}# placeholders with actual values in your CI/CD pipeline.
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: iatec-standard-nestjs-api
  namespace: default
type: Opaque
stringData:
  NODE_ENV: '#{NODE_ENV}#'
  APP_PORT: '#{APP_PORT}#'
  APP_NAME: '#{APP_NAME}#'
  POSTGRES_HOST_READER: '#{POSTGRES_HOST_READER}#'
  POSTGRES_HOST_WRITER: '#{POSTGRES_HOST_WRITER}#'
  POSTGRES_PORT: '#{POSTGRES_PORT}#'
  POSTGRES_DATABASE: '#{POSTGRES_DATABASE}#'
  POSTGRES_USER: '#{POSTGRES_USER}#'
  POSTGRES_PASSWORD: '#{POSTGRES_PASSWORD}#'
  LOG_SERVICE_URL: '#{LOG_SERVICE_URL}#'
  CONTAINER_ID: '#{CONTAINER_ID}#'
  CONTAINER_NAME: '#{CONTAINER_NAME}#'
  LOG_LEVEL: '#{LOG_LEVEL}#'
